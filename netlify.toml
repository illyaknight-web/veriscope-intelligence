[build]
  command = "npm test"
  publish = "."

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."safeplate-sync"]
  schedule = "*/15 * * * *"

# The operational CORE interface is the production entry point.
# A forced rewrite prevents the Netlify root from falling through to a 404
# while preserving the direct CORE URL used in meeting materials.
[[redirects]]
  from = "/"
  to = "/veriscope-v41-core-live.html"
  status = 200
  force = true

[[headers]]
  for = "/veriscope-v41-core-live.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://gibs.earthdata.nasa.gov https://*.basemaps.cartocdn.com; connect-src 'self'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
