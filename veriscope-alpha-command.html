<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#03070d">
  <title>VERISCOPE™ CORE — Command Center</title>
  <style>html,body{margin:0;min-height:100%;background:#03070d;color:#edf6ff;font-family:Inter,Segoe UI,Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;letter-spacing:.18em;font-size:12px;color:#8fb4d1}.boot b{color:#e6b85c}</style>
</head>
<body>
  <div class="boot">VERISCOPE™ <b>CORE</b> · INITIALIZING COMMAND</div>
  <script>
    fetch('/veriscope-v41-core-live.html',{cache:'no-store'})
      .then(response=>{if(!response.ok)throw new Error('COMMAND_'+response.status);return response.text()})
      .then(html=>{document.open();document.write(html);document.close()})
      .catch(()=>{document.querySelector('.boot').innerHTML='VERISCOPE™ <b>CORE</b> · COMMAND CENTER UNAVAILABLE'})
  </script>
</body>
</html>
