name: VERISCOPE mobile alpha upgrade v2
on:
  push:
    paths:
      - '.github/workflows/veriscope-mobile-alpha-upgrade-v2.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile alpha visual upgrades
        shell: python
        run: |
          from pathlib import Path
          import base64
          p=Path('veriscope-alpha-command.html')
          s=p.read_text()
          marker='/* VERISCOPE MOBILE ALPHA PASS 2026-09-05 */'
          if marker in s:
              raise SystemExit('already patched')
          css=base64.b64decode('').decode()
          js=base64.b64decode('').decode()
          s=s.replace('</head>',css+'</head>',1)
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          s=Path('veriscope-alpha-command.html').read_text()
          assert 'VERISCOPE MOBILE ALPHA PASS 2026-09-05' in s
          assert 'accessHeroAlpha' in s
          assert 'statCard:nth-child(5)' in s
          print('validated')
      - name: Commit upgraded target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veriscope-alpha-command.html
          git commit -m "Upgrade VERISCOPE mobile command and access terminal toward alpha reference"
          git push
