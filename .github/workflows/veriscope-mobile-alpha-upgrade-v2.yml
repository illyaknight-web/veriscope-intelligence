name: VERISCOPE mobile alpha upgrade
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify mobile alpha pass is present
        shell: python
        run: |
          from pathlib import Path
          p=Path('veriscope-alpha-command.html')
          s=p.read_text()
          marker='/* VERISCOPE MOBILE ALPHA PASS 2026-09-05 */'
          if marker not in s:
              raise SystemExit('Mobile alpha pass is missing from target; restoration requires the archived transformation, not a blind rewrite.')
          checks=['accessHeroAlpha','accessPanelAlpha','statCard:nth-child(5)','worldWrap']
          missing=[x for x in checks if x not in s]
          if missing:
              raise SystemExit('Missing expected alpha elements: '+str(missing))
          print('VERISCOPE mobile alpha pass present and validated; no file mutation required.')
