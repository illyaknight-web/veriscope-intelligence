name: Final public dash scan
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          dashes='‐‑‒–—−'
          technical={'device width':'device-width','initial scale':'initial-scale','minimum scale':'minimum-scale','maximum scale':'maximum-scale','user scalable':'user-scalable','viewport fit':'viewport-fit','max image preview':'max-image-preview'}
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.github' in p.parts: continue
            if p.suffix.lower() not in {'.html','.htm','.md','.txt','.svg','.xml','.js','.mjs','.json'}: continue
            try: s=p.read_text()
            except: continue
            n=s
            if p.suffix.lower() in {'.js','.mjs','.json'}:
              for c in dashes: n=n.replace(c,' ')
            if p.suffix.lower() in {'.html','.htm'}:
              for a,b in technical.items(): n=n.replace(a,b)
            if n!=s: p.write_text(n)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "Function Media Site Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -m "Finalize public dash cleanup" && git push
