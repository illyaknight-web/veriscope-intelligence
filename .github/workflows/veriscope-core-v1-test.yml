name: VERISCOPE CORE v1 tests
on:
  push:
    branches:
      - main
    paths:
      - 'netlify/functions/**'
      - 'tests/**'
      - 'veriscope-v41-core-live.html'
      - 'veriscope-alpha-command.html'
      - '.github/workflows/veriscope-core-v1-test.yml'
  workflow_dispatch:
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic CORE pipeline tests
        run: node --test tests/core-pipeline.test.mjs
      - name: Check server function syntax
        run: |
          node --check netlify/functions/lib/security.mjs
          node --check netlify/functions/lib/core-engine.mjs
          node --check netlify/functions/lib/core-pipeline.mjs
          node --check netlify/functions/safeplate-ingest.mjs
          node --check netlify/functions/review.mjs
          node --check netlify/functions/ask.mjs
          node --check netlify/functions/health.mjs
      - name: Verify V41 CORE bridge references live endpoints
        run: |
          grep -q "/api/health" veriscope-v41-core-live.html
          grep -q "/api/entities" veriscope-v41-core-live.html
          grep -q "/api/graph" veriscope-v41-core-live.html
          grep -q "/api/findings" veriscope-v41-core-live.html
          grep -q "/api/review" veriscope-v41-core-live.html
          grep -q "/api/ask" veriscope-v41-core-live.html
          grep -q "Global Intelligence Overview" veriscope-v41-core-live.html
          grep -q "overviewGraphSvg" veriscope-v41-core-live.html
          grep -q "SHADOW INTELLIGENCE" veriscope-v41-core-live.html
          grep -q "veriscope-v41-core-live.html" veriscope-alpha-command.html
