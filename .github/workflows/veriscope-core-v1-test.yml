name: VERISCOPE CORE end-to-end smoke
on:
  push:
    branches: [main]
    paths:
      - 'netlify/functions/**'
      - 'tests/**'
      - 'veriscope-v41-core-live.html'
      - 'veriscope-alpha-command.html'
      - '.github/workflows/veriscope-core-v1-test.yml'
  workflow_dispatch:
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production dependencies
        run: npm install --ignore-scripts
      - name: Run deterministic CORE pipeline tests
        run: npm test
      - name: Check every CORE server module
        run: |
          for file in netlify/functions/*.mjs netlify/functions/lib/*.mjs; do node --check "$file"; done
      - name: Verify acceptance record and self-healing endpoint wiring
        run: |
          grep -q "FDA-GREAT-VALUE-TRIPLE-BERRY-2026-09-03" netlify/functions/lib/bootstrap.mjs
          grep -q "ensureAcceptanceRecord" netlify/functions/entities.mjs
          grep -q "ensureAcceptanceRecord" netlify/functions/graph.mjs
          grep -q "ensureAcceptanceRecord" netlify/functions/findings.mjs
      - name: Verify command center uses live CORE endpoints
        run: |
          grep -q "/api/health" veriscope-v41-core-live.html
          grep -q "/api/entities" veriscope-v41-core-live.html
          grep -q "/api/graph" veriscope-v41-core-live.html
          grep -q "/api/findings" veriscope-v41-core-live.html
          grep -q "/api/review" veriscope-v41-core-live.html
          grep -q "veriscope-v41-core-live.html" veriscope-alpha-command.html
