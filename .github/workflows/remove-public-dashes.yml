name: Remove public copy dashes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          exts={'.html','.htm','.md','.txt','.svg','.xml'}
          dash=re.compile('[\u2010\u2011\u2012\u2013\u2014\u2212]')
          hy=re.compile(r'(?<=[A-Za-z0-9])-(?=[A-Za-z0-9])')
          def clean(t): return hy.sub(' ',dash.sub(' ',t))
          for p in Path('.').rglob('*'):
            if not p.is_file() or p.suffix.lower() not in exts or '.github' in p.parts: continue
            try: s=p.read_text()
            except: continue
            if p.suffix.lower() in {'.html','.htm','.svg','.xml'}:
              s=dash.sub(' ',s); parts=re.split(r'(<[^>]+>)',s); out=[]; script=style=False
              for x in parts:
                q=x.lower()
                if x.startswith('<'):
                  if re.match(r'<script\b',q): script=True
                  elif re.match(r'</script\b',q): script=False
                  elif re.match(r'<style\b',q): style=True
                  elif re.match(r'</style\b',q): style=False
                  out.append(x)
                else: out.append(x if script or style else clean(x))
              n=''.join(out)
              n=re.sub(r'((?:content|alt|title|aria-label|placeholder)=["\'])(.*?)(["\'])',lambda m:m.group(1)+clean(m.group(2))+m.group(3),n,flags=re.I)
            else: n=clean(s)
            if n!=s: p.write_text(n)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "Function Media Site Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -m "Remove dashes from public facing copy" && git push
