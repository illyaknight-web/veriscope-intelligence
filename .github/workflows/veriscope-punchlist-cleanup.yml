name: VERISCOPE punch-list cleanup
on:
  push:
    paths:
      - '.github/workflows/veriscope-punchlist-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finish sidebar orb flow and responsive interior layout
        shell: python
        run: |
          from pathlib import Path
          p=Path('veriscope-alpha-command.html')
          s=p.read_text()
          old='.sideOrb{position:absolute;width:240px;height:240px;border-radius:50%;left:-105px;bottom:-95px;'
          new='.sideOrb{position:relative;flex:0 0 150px;width:190px;height:190px;border-radius:50%;left:-72px;bottom:auto;margin:8px 0 0;'
          assert old in s
          s=s.replace(old,new,1)
          # Interior responsive rules only; Command and top bar are not touched.
          marker='@media(max-width:860px){'
          addition='@media(max-width:860px){.workspaceGrid{grid-template-columns:1fr}.caseTimeline{grid-template-columns:1fr 1fr}.tableRow,.adapterTable .tableRow{grid-template-columns:110px 1fr 90px}.tableRow span:nth-child(3){display:none}'
          assert marker in s
          s=s.replace(marker,addition,1)
          marker2='@media(max-width:560px){'
          addition2='@media(max-width:560px){.caseTimeline{grid-template-columns:1fr}.deepGraph{height:430px}.deepNode{min-width:auto;padding:6px;font-size:7px}.tableRow,.adapterTable .tableRow{grid-template-columns:90px 1fr 78px;padding:9px 8px;gap:7px}'
          assert marker2 in s
          s=s.replace(marker2,addition2,1)
          assert '.sideOrb{position:absolute' not in s
          p.write_text(s)
      - name: Validate final punch-list state
        run: |
          ! grep -q '.sideOrb{position:absolute' veriscope-alpha-command.html
          grep -q 'id="deepGraph"' veriscope-alpha-command.html
          grep -q 'SRC-00822' veriscope-alpha-command.html
          grep -q 'DEMO DATA' veriscope-alpha-command.html
          ! grep -q 'CODED' veriscope-alpha-command.html
      - name: Commit target and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add veriscope-alpha-command.html
          git rm -f .github/workflows/veriscope-punchlist-fix.yml .github/workflows/veriscope-punchlist-cleanup.yml
          git commit -m 'Finish VERISCOPE punch-list fixes and remove one-time workflows'
          git push