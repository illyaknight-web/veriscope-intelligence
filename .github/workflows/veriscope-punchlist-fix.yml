name: VERISCOPE punch-list repair
on:
  push:
    paths:
      - '.github/workflows/veriscope-punchlist-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only requested VERISCOPE areas
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('veriscope-alpha-command.html')
          s=p.read_text()

          # BUG 1: sidebar lower content must flow beneath nav, never overlap it.
          s=s.replace('.sidebar{position:sticky;top:64px;height:calc(100vh - 64px);border-right:1px solid var(--line);background:linear-gradient(180deg,#07111b,#050b12 70%,#061323);overflow:hidden}',
          '.sidebar{position:sticky;top:64px;height:calc(100vh - 64px);border-right:1px solid var(--line);background:linear-gradient(180deg,#07111b,#050b12 70%,#061323);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(94,160,225,.28) transparent}')
          s=s.replace('.nav{padding:12px 0}', '.nav{padding:12px 0 10px;flex:0 0 auto}')
          s=s.replace('.domains{position:absolute;left:20px;right:16px;bottom:93px}', '.domains{position:static;margin:0 16px;padding:16px 4px 6px;border-top:1px solid var(--line);flex:0 0 auto}')
          s=s.replace('.domainTag{display:block;color:#a7bfd5;text-decoration:none;font-size:9px;letter-spacing:.14em;margin:11px 0}', '.domainTag{display:block;color:#a7bfd5;text-decoration:none;font-size:9px;letter-spacing:.14em;margin:9px 0;line-height:1.25}')
          s=s.replace('.sideQuote{font-size:9px;line-height:1.55;color:#d7e4ef;letter-spacing:.1em;margin-bottom:17px}', '.sideQuote{font-size:9px;line-height:1.55;color:#d7e4ef;letter-spacing:.1em;margin-bottom:14px}')
          s=re.sub(r'\\.sideOrb\\{position:absolute;width:240px;height:240px;border-radius:50%;left:-105px;bottom:-95px;', '.sideOrb{position:relative;flex:0 0 150px;width:190px;height:190px;border-radius:50%;left:-72px;bottom:auto;margin:8px 0 0;', s, count=1)
          s=s.replace('.sideFooter{position:absolute;left:20px;bottom:14px;font-size:8px;letter-spacing:.16em;color:#6d859c;z-index:2}', '.sideFooter{position:static;flex:0 0 auto;margin:8px 20px 18px;font-size:8px;letter-spacing:.16em;color:#6d859c;z-index:2}')
          s=s.replace('.sectionPage{border:1px solid var(--lineStrong);background:#07121c;min-height:calc(100vh - 95px);box-shadow:var(--shadow)}', '.sectionPage{border:1px solid var(--lineStrong);background:#07121c;min-height:0;box-shadow:var(--shadow)}')

          styles='''.interiorStack{display:grid;gap:12px;margin-top:12px}.workspaceGrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.5fr);gap:10px}.deepPanel{border:1px solid var(--line);background:#081521}.deepHead{min-height:38px;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.deepHead strong{font-size:9px;letter-spacing:.1em}.deepSub{font-size:8px;color:#8098ae}.deepGraph{height:390px;position:relative;overflow:hidden;background:radial-gradient(circle at 46% 51%,rgba(40,112,191,.17),transparent 34%),#06111b}.deepEdge{position:absolute;height:1px;background:#567896;opacity:.7;transform-origin:left center}.de1{left:20%;top:26%;width:31%;transform:rotate(22deg)}.de2{left:45%;top:50%;width:30%;transform:rotate(-42deg)}.de3{left:45%;top:50%;width:31%;transform:rotate(8deg)}.de4{left:44%;top:52%;width:30%;transform:rotate(43deg)}.de5{left:20%;top:73%;width:30%;transform:rotate(-38deg)}.deepNode{position:absolute;border:1px solid #2d628f;background:#081a29;color:#e9f4ff;padding:8px 10px;display:flex;align-items:center;gap:7px;font-size:8px;border-radius:3px;min-width:120px}.deepNode:hover,.deepNode.active{border-color:var(--gold2);box-shadow:0 0 24px rgba(255,194,75,.14)}.deepNode .orb{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#0c3152;border:1px solid #54a7f6}.deepNode.gold{border-color:#82652a}.deepNode.gold .orb{background:#3b2a0c;border-color:#f0a93b}.deepNode.green{border-color:#2b7662}.deepNode.green .orb{background:#0b2a23;border-color:#38d996}.deepNode.red{border-color:#7e3739}.deepNode.red .orb{background:#311215;border-color:#e5484d}.dnCompany{left:39%;top:43%}.dnSource{left:7%;top:17%}.dnShip{left:5%;top:43%}.dnReg{left:7%;bottom:11%}.dnProduct{left:53%;top:11%}.dnFacility{left:56%;top:59%}.dnEvent{right:6%;top:20%}.dnReview{right:5%;bottom:12%}.deepControls{position:absolute;left:10px;bottom:10px;display:flex;gap:5px}.deepLegend{position:absolute;right:10px;bottom:10px;font-size:7px;color:#91a7bb;background:rgba(4,10,16,.82);padding:5px 7px;border:1px solid rgba(85,136,188,.18)}.inspectorBody{padding:12px}.inspectName{font-size:14px;font-weight:700}.inspectMeta{font-size:8px;color:#8ba1b7;margin:4px 0 12px}.kv{display:grid;grid-template-columns:92px 1fr;gap:7px;font-size:8px;padding:7px 0;border-bottom:1px solid rgba(85,136,188,.16)}.kv span:first-child{color:#708ba4}.caseTable,.sourceTable,.adapterTable{border:1px solid var(--line);background:#081521}.tableRow{display:grid;grid-template-columns:140px 1.4fr 1fr 110px;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid rgba(85,136,188,.18);font-size:8px}.tableRow.head{color:#8da5bb;font-size:7px;letter-spacing:.1em;background:#07111b}.tableRow:last-child{border-bottom:0}.adapterTable .tableRow{grid-template-columns:150px 1.4fr 1fr 110px}.caseTimeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.timelineCard{border:1px solid var(--line);background:#081521;padding:12px;min-height:105px}.timelineCard .time{font-size:8px;color:#66b7ff}.timelineCard b{display:block;font-size:10px;margin:7px 0}.timelineCard p{margin:0;color:#839bb1;font-size:8px;line-height:1.5}.sectionNote{font-size:8px;color:#8199af;line-height:1.55;margin-top:10px}.demoChip[title]{cursor:help}'''
          s=s.replace('.mobileNav{display:none}', styles+'.mobileNav{display:none}',1)
          s=s.replace('.navBtn .label,.domains,.sideFooter{display:none}', '.navBtn .label,.domains,.sideOrb,.sideFooter{display:none}')

          graph='''<section id="page-graph" class="page"><div class="sectionPage"><div class="sectionHead"><div class="sectionEy">EVIDENCE GRAPH</div><div class="sectionTitle">Relationship Intelligence</div><div class="sectionSub">Traceable entity relationships with confidence and source provenance.</div></div><div class="sectionBody"><div class="dataGrid"><div class="dataCard"><h3>Traceable relationships</h3><p>Every relationship is associated with source evidence and provenance. AI inference alone never creates a verified relationship.</p></div><div class="dataCard"><h3>Confidence ≠ Risk</h3><p>VERISCOPE stores confidence and operational risk as separate values.</p></div><div class="dataCard"><h3>Human verification</h3><p>Consequential findings remain pending until an authorized human decision is recorded.</p><button class="smallBtn" data-page="review">Open Human Review</button></div></div><div class="interiorStack"><div class="workspaceGrid"><div class="deepPanel"><div class="deepHead"><div><strong>CASE 26-0905-014 · ACTIVE EVIDENCE GRAPH</strong><div class="deepSub">12 entities · 28 source records · 8 visible relationships</div></div><button class="smallBtn" data-page="command">Open Command View</button></div><div class="deepGraph" id="deepGraph"><div class="deepEdge de1"></div><div class="deepEdge de2"></div><div class="deepEdge de3"></div><div class="deepEdge de4"></div><div class="deepEdge de5"></div><button class="deepNode dnSource" data-deep-name="Financial Record" data-deep-type="Source" data-deep-location="New York, NY"><span class="orb">▤</span>Financial Record</button><button class="deepNode dnShip" data-deep-name="Shipping Manifest" data-deep-type="Source" data-deep-location="Newark, NJ"><span class="orb">▤</span>Shipping Manifest</button><button class="deepNode dnReg" data-deep-name="Regulatory Filing" data-deep-type="Source" data-deep-location="Washington, DC"><span class="orb">▤</span>Regulatory Filing</button><button class="deepNode gold dnCompany active" data-deep-name="Northbridge Components Ltd." data-deep-type="Company" data-deep-location="Toronto, Canada"><span class="orb">▥</span>Company</button><button class="deepNode dnProduct" data-deep-name="Product Line X7" data-deep-type="Product" data-deep-location="Global"><span class="orb">◆</span>Product</button><button class="deepNode green dnFacility" data-deep-name="Facility 17" data-deep-type="Location" data-deep-location="Rotterdam, NL"><span class="orb">⌂</span>Facility</button><button class="deepNode red dnEvent" data-deep-name="Compliance Event" data-deep-type="Event" data-deep-location="EU Region"><span class="orb">!</span>Event</button><button class="deepNode dnReview" data-deep-name="Human Review Queue" data-deep-type="Review" data-deep-location="Analyst Workspace"><span class="orb">✓</span>Review</button><div class="deepControls"><button class="smallBtn" id="deepZoomIn">＋</button><button class="smallBtn" id="deepZoomOut">−</button><button class="smallBtn" id="deepFit">Fit</button><button class="smallBtn" id="deepFilters">Filters</button></div><div class="deepLegend">● Entity ◆ Product ● Location ● Event ● Source — Relationship</div></div></div><div class="deepPanel"><div class="deepHead"><strong>RELATIONSHIP INSPECTOR</strong><button class="viewAll" data-page="sources">Trace Source →</button></div><div class="inspectorBody"><div class="inspectName" id="deepInspectName">Northbridge Components Ltd.</div><div class="inspectMeta" id="deepInspectMeta">Company · Toronto, Canada</div><div class="kv"><span>Confidence</span><span>91%</span></div><div class="kv"><span>Risk</span><span class="badge high">HIGH</span></div><div class="kv"><span>Supporting Evidence</span><span>5 source records</span></div><div class="kv"><span>Contradictions</span><span>1 unresolved record</span></div><div class="kv"><span>Review State</span><span class="badge med">PENDING</span></div><div class="kv"><span>Provenance</span><span>Source-backed relationship</span></div><button class="detailAction" style="margin-top:12px;width:100%" data-page="audit">TRACE TO SOURCE</button></div></div></div></div></div></div></section>'''
          s=re.sub(r'<section id="page-graph" class="page">.*?</section>(?=<section id="page-investigations")', graph, s, flags=re.S)

          investigations='''<section id="page-investigations" class="page"><div class="sectionPage"><div class="sectionHead"><div class="sectionEy">INVESTIGATIONS</div><div class="sectionTitle">Persistent Case Workspace</div><div class="sectionSub">Entities, evidence, chronology, findings, reviews and audit state in one case file.</div></div><div class="sectionBody"><div class="dataGrid"><div class="dataCard"><h3>Entities</h3><p>12 canonical entity records, aliases, identifiers and relationship histories.</p><button class="smallBtn" data-page="graph">Open Graph</button></div><div class="dataCard"><h3>Evidence</h3><p>28 supporting and contradicting source records with timestamps and provenance.</p><button class="smallBtn" data-page="sources">View Evidence</button></div><div class="dataCard"><h3>Timeline</h3><p>Chronological reconstruction from ingestion through human decision.</p><button class="smallBtn" data-page="audit">Open Audit</button></div></div><div class="interiorStack"><div class="caseTable"><div class="tableRow head"><span>CASE</span><span>INVESTIGATION</span><span>STATE</span><span>ACTION</span></div><div class="tableRow"><span class="mono">26-0905-014</span><span>Cross-Border Supply Chain Investigation</span><span><span class="activePill">ACTIVE</span></span><span><button class="smallBtn" data-page="graph">Open</button></span></div><div class="tableRow"><span class="mono">26-0905-011</span><span>Ownership Structure Discrepancy</span><span><span class="badge med">ANALYSIS</span></span><span><button class="smallBtn" data-page="cases">Open</button></span></div><div class="tableRow"><span class="mono">26-0904-028</span><span>Infrastructure Vendor Relationship</span><span><span class="badge high">HIGH</span></span><span><button class="smallBtn" data-page="cases">Open</button></span></div></div><div class="caseTimeline"><div class="timelineCard"><span class="time mono">09:42:14</span><b>Ingested</b><p>Regulatory source record entered CORE with original provenance preserved.</p></div><div class="timelineCard"><span class="time mono">09:42:15</span><b>Resolved</b><p>Northbridge Components Ltd. matched to the canonical company entity.</p></div><div class="timelineCard"><span class="time mono">09:42:17</span><b>Correlated</b><p>Cross-border facility and ownership relationships identified from source records.</p></div><div class="timelineCard"><span class="time mono">09:42:20</span><b>Review Required</b><p>Finding remains pending until an authorized analyst records a decision.</p></div></div></div></div></div></section>'''
          s=re.sub(r'<section id="page-investigations" class="page">.*?</section>(?=<section id="page-review")', investigations, s, flags=re.S)

          sources='''<section id="page-sources" class="page"><div class="sectionPage"><div class="sectionHead"><div class="sectionEy">SOURCES</div><div class="sectionTitle">Evidence Provenance Registry</div><div class="sectionSub">Original source records remain traceable through normalization, resolution, correlation and review.</div></div><div class="sectionBody"><div class="dataGrid"><div class="dataCard"><h3>SRC-00841</h3><p>Regulatory Filing · OFFICIAL SOURCE FACT · VERIFIED</p></div><div class="dataCard"><h3>SRC-00839</h3><p>Shipping Manifest · COMMERCIAL RECORD · INGESTED</p></div><div class="dataCard"><h3>SRC-00836</h3><p>Corporate Registration · GOVERNMENT RECORD · VERIFIED</p></div></div><div class="interiorStack"><div class="sourceTable"><div class="tableRow head"><span>SOURCE ID</span><span>TYPE / ORIGIN</span><span>PROVENANCE</span><span>STATUS</span></div><div class="tableRow"><span class="mono">SRC-00841</span><span>Regulatory Filing · Washington, DC</span><span>OFFICIAL SOURCE FACT</span><span class="badge low">VERIFIED</span></div><div class="tableRow"><span class="mono">SRC-00839</span><span>Shipping Manifest · Newark, NJ</span><span>COMMERCIAL RECORD</span><span class="badge low">INGESTED</span></div><div class="tableRow"><span class="mono">SRC-00836</span><span>Corporate Registration · Toronto, CA</span><span>GOVERNMENT RECORD</span><span class="badge low">VERIFIED</span></div><div class="tableRow"><span class="mono">SRC-00831</span><span>Facility Registration · Rotterdam, NL</span><span>OFFICIAL SOURCE FACT</span><span class="badge low">VERIFIED</span></div><div class="tableRow"><span class="mono">SRC-00827</span><span>Financial Disclosure · New York, NY</span><span>COMMERCIAL RECORD</span><span class="badge med">REVIEW</span></div><div class="tableRow"><span class="mono">SRC-00822</span><span>Ownership Filing · Ontario, CA</span><span>GOVERNMENT RECORD</span><span class="badge low">VERIFIED</span></div></div><div class="sectionNote">Demo source records are intentionally labeled. In production, each row retains source ID, source timestamp, ingestion timestamp, provenance class and review state.</div></div></div></div></section>'''
          s=re.sub(r'<section id="page-sources" class="page">.*?</section>(?=<section id="page-adapters")', sources, s, flags=re.S)

          adapters='''<section id="page-adapters" class="page"><div class="sectionPage"><div class="sectionHead"><div class="sectionEy">DOMAIN ADAPTERS</div><div class="sectionTitle">Connected Platforms</div><div class="sectionSub">VERISCOPE CORE remains independent. External platforms connect through explicit adapters.</div></div><div class="sectionBody"><div class="dataGrid"><div class="dataCard"><h3>SAFEPLATE™</h3><p><b>SEPARATE FUNCTION MEDIA PLATFORM.</b> Shadow adapter connected for normalized record ingestion only. SAFEPLATE is not a VERISCOPE module.</p><span class="badge low">1 CONNECTED</span></div><div class="dataCard"><h3>DEFENSE</h3><p>Domain adapter architecture identified. Production adapter not enabled in this demonstration.</p><span class="badge med">PLANNED</span></div><div class="dataCard"><h3>CYBER / JURIS / EDUCATION</h3><p>Independent domain pathways can connect to CORE without changing CORE evidence-governance rules.</p><span class="badge med">PLANNED</span></div></div><div class="interiorStack"><div class="adapterTable"><div class="tableRow head"><span>ADAPTER</span><span>BOUNDARY</span><span>MODE</span><span>STATE</span></div><div class="tableRow"><span>SAFEPLATE™</span><span>Normalized records → VERISCOPE CORE</span><span>Read-only shadow ingestion</span><span class="badge low">CONNECTED</span></div><div class="tableRow"><span>VERISCOPE DEFENSE™</span><span>Independent domain pathway</span><span>Architecture identified</span><span class="badge med">PLANNED</span></div><div class="tableRow"><span>VERISCOPE CYBER™</span><span>Independent domain pathway</span><span>Architecture identified</span><span class="badge med">PLANNED</span></div><div class="tableRow"><span>VERISCOPE JURIS™</span><span>Independent domain pathway</span><span>Architecture identified</span><span class="badge med">PLANNED</span></div><div class="tableRow"><span>Education pathway</span><span>Independent domain pathway</span><span>Architecture identified</span><span class="badge med">PLANNED</span></div></div><div class="sectionNote">Adapters never change CORE evidence-governance rules. Source provenance, confidence, human review and audit boundaries remain intact across connected platforms.</div></div></div></div></section>'''
          s=re.sub(r'<section id="page-adapters" class="page">.*?</section>(?=<section id="page-analytics")', adapters, s, flags=re.S)

          # BUG 3: CODED is a dev/build leftover and is not present. DEMO DATA is intentional truth-boundary labeling.
          s=s.replace('<div class="demoChip">DEMO DATA</div>', '<div class="demoChip" title="Demonstration metrics are intentionally labeled and are not presented as live operational counts.">DEMO DATA</div>')

          deep_js="""document.querySelectorAll('.deepNode').forEach(n=>n.addEventListener('click',()=>{document.querySelectorAll('.deepNode').forEach(x=>x.classList.remove('active'));n.classList.add('active');const name=document.getElementById('deepInspectName'),meta=document.getElementById('deepInspectMeta');if(name)name.textContent=n.dataset.deepName;if(meta)meta.textContent=`${n.dataset.deepType} · ${n.dataset.deepLocation}`}));const deepZoomIn=document.getElementById('deepZoomIn'),deepZoomOut=document.getElementById('deepZoomOut'),deepFit=document.getElementById('deepFit'),deepFilters=document.getElementById('deepFilters');if(deepZoomIn)deepZoomIn.onclick=()=>document.getElementById('deepGraph').style.transform='scale(1.03)';if(deepZoomOut)deepZoomOut.onclick=()=>document.getElementById('deepGraph').style.transform='scale(.97)';if(deepFit)deepFit.onclick=()=>document.getElementById('deepGraph').style.transform='none';if(deepFilters)deepFilters.onclick=()=>alert('Graph filters: Entity, Product, Location, Event, Source.');"""
          s=s.replace('(async()=>{try{let r=await fetch(\'/api/health\')', deep_js+'(async()=>{try{let r=await fetch(\'/api/health\')',1)
          s=s.replace('(async()=>{try{const r=await fetch(\'/api/health\')', deep_js+'(async()=>{try{const r=await fetch(\'/api/health\')',1)

          assert 'position:absolute;left:20px;right:16px;bottom:93px' not in s
          assert 'min-height:calc(100vh - 95px)' not in s
          assert 'id="deepGraph"' in s
          assert 'SRC-00822' in s
          assert 'VERISCOPE DEFENSE™' in s
          assert 'CODED' not in s
          p.write_text(s)
      - name: Validate targeted fixes
        run: |
          grep -q 'id="deepGraph"' veriscope-alpha-command.html
          grep -q 'SRC-00822' veriscope-alpha-command.html
          grep -q 'DEMO DATA' veriscope-alpha-command.html
          ! grep -q 'position:absolute;left:20px;right:16px;bottom:93px' veriscope-alpha-command.html
      - name: Commit target file only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add veriscope-alpha-command.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix VERISCOPE sidebar and interior page punch list'
          git push